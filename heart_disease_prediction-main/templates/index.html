<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Risk Assessment System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div style="text-align: center;">
        <span class="header-badge">AI Clinical Decision Support</span>
        <h1>❤️ Heart Disease Risk Assessment</h1>
        <p class="subtitle">Enter patient health metrics below to evaluate clinical cardiovascular risk.</p>
    </div>

    <form action="/predict" method="POST" class="form-grid">

        <div class="input-group">
            <label for="age">Age (years)</label>
            <input type="number" id="age" name="age" placeholder="e.g. 52" required min="1" max="120">
        </div>

        <div class="input-group">
            <label for="sex">Gender</label>
            <select id="sex" name="sex">
                <option value="1">Male</option>
                <option value="0">Female</option>
            </select>
        </div>

        <div class="input-group">
            <label for="cp">Chest Pain Type</label>
            <select id="cp" name="cp">
                <option value="0">Typical Angina</option>
                <option value="1">Atypical Angina</option>
                <option value="2">Non-anginal Pain</option>
                <option value="3">Asymptomatic</option>
            </select>
        </div>

        <div class="input-group">
            <label for="trestbps">Resting BP (mm Hg)</label>
            <input type="number" id="trestbps" name="trestbps" placeholder="e.g. 120" required>
        </div>

        <div class="input-group">
            <label for="chol">Serum Cholesterol (mg/dl)</label>
            <input type="number" id="chol" name="chol" placeholder="e.g. 210" required>
        </div>

        <div class="input-group">
            <label for="fbs">Fasting Blood Sugar > 120 mg/dl</label>
            <select id="fbs" name="fbs">
                <option value="0">No (<= 120 mg/dl)</option>
                <option value="1">Yes (> 120 mg/dl)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="restecg">Resting ECG Results</label>
            <select id="restecg" name="restecg">
                <option value="0">Normal</option>
                <option value="1">ST-T Wave Abnormality</option>
                <option value="2">Left Ventricular Hypertrophy</option>
            </select>
        </div>

        <div class="input-group">
            <label for="thalach">Max Heart Rate Achieved</label>
            <input type="number" id="thalach" name="thalach" placeholder="e.g. 150" required>
        </div>

        <div class="input-group">
            <label for="exang">Exercise Induced Angina</label>
            <select id="exang" name="exang">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>
        </div>

        <div class="input-group">
            <label for="oldpeak">ST Depression (Oldpeak)</label>
            <input type="number" step="0.1" id="oldpeak" name="oldpeak" placeholder="e.g. 1.4" required>
        </div>

        <div class="input-group">
            <label for="slope">Slope of Peak Exercise ST</label>
            <select id="slope" name="slope">
                <option value="0">Upsloping</option>
                <option value="1">Flat</option>
                <option value="2">Downsloping</option>
            </select>
        </div>

        <div class="input-group">
            <label for="ca">Major Vessels (0 - 4)</label>
            <select id="ca" name="ca">
                <option value="0">0 Vessels</option>
                <option value="1">1 Vessel</option>
                <option value="2">2 Vessels</option>
                <option value="3">3 Vessels</option>
                <option value="4">4 Vessels</option>
            </select>
        </div>

        <div class="input-group">
            <label for="thal">Thalassemia Result</label>
            <select id="thal" name="thal">
                <option value="1">Normal</option>
                <option value="2">Fixed Defect</option>
                <option value="3">Reversible Defect</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">
            Generate Risk Prediction →
        </button>

    </form>

</div>

</body>
</html>
